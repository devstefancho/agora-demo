# 파트너 앱 — iOS 한 화면 앱. XcodeGen 으로 생성한다: `scripts/ios.sh gen`
# .xcodeproj 는 생성물이라 커밋하지 않는다. 서명 Team ID 는 Signing.xcconfig (gitignore) 에 둔다.
name: Partner
options:
  bundleIdPrefix: com.devstefancho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  AgoraRtcEngine:
    url: https://github.com/AgoraIO/AgoraRtcEngine_iOS
    from: "4.5.0"
  # 상대 마이크·카메라 상태를 나르는 Signaling(RTM). 웹의 lib/agora/rtm.ts 와 짝이다.
  AgoraRtm:
    url: https://github.com/AgoraIO/AgoraRtm_iOS
    from: "2.2.0"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targets:
  Partner:
    type: application
    platform: iOS
    sources:
      - Partner
    dependencies:
      - package: AgoraRtcEngine
        product: RtcBasic
      - package: AgoraRtm
        product: AgoraRTM
    info:
      path: Partner/Info.plist
      properties:
        CFBundleDisplayName: 파트너
        UILaunchScreen: {}
        # 픽셀 폰트 갈무리(OFL-1.1). 웹과 같은 글꼴. 원본은 web/node_modules/galmuri/dist, 라이선스는 Fonts/Galmuri-OFL.txt
        UIAppFonts:
          - Galmuri11.ttf
          - Galmuri11-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          # 공유 화면을 크게 보려고 눕힌다
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 파트너에게 내 얼굴을 보여주기 위해 카메라를 사용합니다.
        NSMicrophoneUsageDescription: 파트너와 대화하기 위해 마이크를 사용합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devstefancho.partner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        # 터미널 빌드(xcodebuild + simctl/devicectl 설치)에서 SPM 바이너리 프레임워크를 찾게 한다.
        # Xcode 16+ 의 debug dylib 분리는 앱 밖의 DerivedData 경로를 rpath 로 참조해 설치본에서 깨진다.
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
